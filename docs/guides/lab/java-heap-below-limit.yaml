apiVersion: apps/v1
kind: Deployment
metadata: {name: orders-sized, namespace: lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: orders-sized}}
  template:
    metadata: {labels: {app: orders-sized}, annotations: {lastwords.dev/ignore: "true"}}
    spec:
      containers:
        - name: orders-sized
          image: eclipse-temurin:21-jdk
          env: [{name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=50 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dumps"}]
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /tmp/src && cat > /tmp/src/Orders.java <<'J'
              import java.util.*;
              public class Orders {
                record Order(String id, byte[] lines) {}
                public static void main(String[] a) throws Exception {
                  Map<String, Order> recent = new HashMap<>();
                  Thread.sleep(5000);
                  for (long n = 0;; n++) {
                    recent.put("o-" + n, new Order("o-" + n, new byte[64 * 1024]));
                    if (n % 10 == 0) Thread.sleep(100);
                  }
                }
              }
              J
              exec java /tmp/src/Orders.java
          resources: {limits: {memory: 384Mi}}
          volumeMounts: [{name: dumps, mountPath: /dumps}]
      volumes: [{name: dumps, emptyDir: {}}]

