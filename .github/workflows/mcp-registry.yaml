name: mcp-registry
# Publishes deploy/distribution/server.json to registry.modelcontextprotocol.io
# for each release. GitHub OIDC proves the run belongs to Arvo-AI, which owns
# the io.github.Arvo-AI namespace (case-sensitive); no secret is stored.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag: {description: "Release tag to publish, e.g. v0.1.3", required: true}
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      PUBLISHER: v1.8.7
      PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
    steps:
      # server.json comes from main (metadata fixes need no new tag); only the
      # version and image tag come from the release.
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sSLo p.tgz "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  p.tgz" | sha256sum -c -
          tar xzf p.tgz mcp-publisher
      - name: Point server.json at this release
        run: |
          V=${TAG#v}
          jq --arg v "$V" --arg img "ghcr.io/arvo-ai/lastwords:$TAG" \
            '.version = $v | .packages[0].identifier = $img' deploy/distribution/server.json > server.json
          cat server.json
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish server.json
