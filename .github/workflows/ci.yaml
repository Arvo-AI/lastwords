name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        # Match go.mod's toolchain line; go-version-file installs the older
        # 'go' version and then downloads the toolchain again on every run.
        with: {go-version: '1.26.10'}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      # Tag runs can only restore caches saved on main, so compile every
      # release target here (same flags as goreleaser); releases then reuse it.
      - name: Warm the release build cache
        if: github.event_name == 'push'
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath -o /dev/null ./cmd/lastwords
          done
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/lastwords
  e2e:
    # A real Linux host: core_pattern is node-wide here, so the segfaulting
    # demo produces a real core dump.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        # Match go.mod's toolchain line; go-version-file installs the older
        # 'go' version and then downloads the toolchain again on every run.
        with: {go-version: '1.26.10'}
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with: {install_only: true}
      - run: sudo mkdir -p /var/lib/lastwords-kind
      - run: E2E_TIMEOUT=420 ./test/e2e/kind.sh
      - if: failure()
        run: |
          kubectl --context kind-lastwords -n lastwords logs ds/lastwords --tail=200 || true
          kubectl --context kind-lastwords -n shop get pods -o wide || true
