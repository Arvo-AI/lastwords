name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.10'}  # go.mod toolchain
      - uses: goreleaser/goreleaser-action@v6
        with: {args: release --clean}
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/arvo-ai/lastwords:${{ github.ref_name }}
            ghcr.io/arvo-ai/lastwords:latest
  chart:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Push chart to GHCR
        run: |
          V=${GITHUB_REF_NAME#v}
          sed -i "s/^version:.*/version: $V/; s/^appVersion:.*/appVersion: \"$GITHUB_REF_NAME\"/" deploy/helm/lastwords/Chart.yaml
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/lastwords -d dist
          helm push dist/lastwords-$V.tgz oci://ghcr.io/arvo-ai/charts
