{{- if .Values.api.createSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "lastwords-api" }}
apiVersion: v1
kind: Secret
metadata:
  name: lastwords-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "lastwords.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data.token }}
  token: {{ $existing.data.token }}
  {{- else }}
  token: {{ randAlphaNum 40 | b64enc }}
  {{- end }}
{{- end }}
